<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Emulator - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #05020a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #0b0512; padding: 20px; border-radius: 10px; border: 1px solid #1a0b2e; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; background: #1a0b2e; border: 1px solid #333; color: #fff; border-radius: 5px; }
        button { background: #ff0066; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Manage Emulator</h2>
        <h3>Settings (Video & RAR)</h3>
        <input type="text" id="videoUrl" placeholder="YouTube or Drive Video URL">
        <input type="text" id="howToSkip" placeholder="How to Skip Link">
        <input type="text" id="rarPassword" placeholder="RAR Password">
        <button onclick="saveSettings()">Save Settings</button>

        <hr style="border-color: #333; margin: 20px 0;">

        <h3>Add Emulator Item</h3>
        <input type="text" id="itemTitle" placeholder="Item Title">
        <input type="text" id="itemDownload" placeholder="Download Link">
        <button onclick="addItem()">Add Item</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const db = getDatabase(initializeApp(firebaseConfig));

        onValue(ref(db, "settings/emulator"), snapshot => {
            const data = snapshot.val() || {};
            document.getElementById("videoUrl").value = data.video_url || "";
            document.getElementById("howToSkip").value = data.how_to_skip || "";
            document.getElementById("rarPassword").value = data.rar_password || "";
        });

        window.saveSettings = function() {
            set(ref(db, "settings/emulator"), {
                video_url: document.getElementById("videoUrl").value,
                how_to_skip: document.getElementById("howToSkip").value,
                rar_password: document.getElementById("rarPassword").value
            }).then(() => alert("Settings saved!"));
        };

        window.addItem = function() {
            const title = document.getElementById("itemTitle").value;
            const download = document.getElementById("itemDownload").value;
            if (!title) return alert("Enter a title");
            push(ref(db, "emulator"), { title, download }).then(() => {
                alert("Item added!");
                document.getElementById("itemTitle").value = "";
                document.getElementById("itemDownload").value = "";
            });
        };
    </script>
</body>
</html>
