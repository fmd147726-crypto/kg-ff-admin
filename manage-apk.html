<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Free Fire APK - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #05020a; --card-bg: #0b0512; --border-color: #1a0b2e;
            --neon-pink: #ff0066; --neon-purple: #9d00ff; --orange-color: #ffaa00;
            --neon-green: #00cc66; --text-light: #ffffff; --text-gray: #777777;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-size: 22px; font-weight: 900; text-transform: uppercase; color: white; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        h3 { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--neon-purple); margin: 20px 0 10px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-gray); margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px 15px; background: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 13px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--neon-pink); }
        .save-btn { background: var(--neon-pink); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 5px; }
        .save-btn:hover { background: #e0005b; box-shadow: 0 0 15px rgba(255, 0, 102, 0.4); }
        .add-btn { background: var(--neon-green); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 5px; }
        .add-btn:hover { box-shadow: 0 0 15px rgba(0, 204, 102, 0.4); }
        hr { border: none; border-top: 1px solid var(--border-color); margin: 30px 0; }
    </style>
</head>
