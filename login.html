<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KG FF PANEL | Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05020a;
            --card-bg: #0b0512;
            --card-border: #1a0b2e;
            --neon-pink: #ff0066;
            --neon-green: #00cc66;
            --text-light: #e2d9f3;
            --text-dim: #a291b5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 15px rgba(255,0,102,0.15);
            text-align: center;
        }
        .login-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,0,102,0.5);
        }
        .login-card p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-google {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ffffff33;
            background: #ffffff;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .btn-google:hover {
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }
        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            color: var(--text-dim);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: var(--card-border);
        }
        .divider span { padding: 0 10px; }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #05020a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: var(--neon-pink);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--neon-pink), #990033);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255,0,102,0.4);
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255,0,102,0.7);
        }
        .alert-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .alert-error {
            background: rgba(255, 0, 102, 0.15);
            border: 1px solid var(--neon-pink);
            color: #ff3385;
        }
        .alert-success {
            background: rgba(0, 204, 102, 0.15);
            border: 1px solid var(--neon-green);
            color: #33ff99;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="login-card">
        <h2>KG FF PANEL Admin</h2>
        <p>Sign in with an authorized admin account.</p>

        <button class="btn-google" id="googleBtn">
            <i class="fab fa-google"></i> Continue with Google
        </button>

        <div class="divider"><span>OR SIGN IN WITH EMAIL</span></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Admin Gmail</label>
                <input type="email" id="emailInput" placeholder="admin@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">SIGN IN</button>
        </form>

        <div id="alertBox" class="alert-box"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "kg-ff-panel.firebaseapp.com",
            databaseURL: "https://kg-ff-panel-default-rtdb.firebaseio.com",
            projectId: "kg-ff-panel",
            storageBucket: "kg-ff-panel.appspot.com",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const database = firebase.database();

        function showAlert(msg, type = 'error') {
            const box = document.getElementById('alertBox');
            box.innerText = msg;
            box.className = 'alert-box ' + (type === 'error' ? 'alert-error' : 'alert-success');
            box.style.display = 'block';
        }

        async function verifyAdminAndRedirect(user) {
            const sanitizedEmail = user.email.replace(/\./g, ',');
            
            // Check super admin and normal admin nodes
            const superSnap = await database.ref('admins/super/' + sanitizedEmail).once('value');
            const normalSnap = await database.ref('admins/normal/' + sanitizedEmail).once('value');

            if (superSnap.exists() || normalSnap.exists()) {
                showAlert('Login Successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                await auth.signOut();
                showAlert('Access Denied: Your email (' + user.email + ') is not an authorized admin.');
            }
        }

        // Email / Password Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            try {
                const res = await auth.signInWithEmailAndPassword(email, password);
                await verifyAdminAndRedirect(res.user);
            } catch (err) {
                showAlert(err.message);
            }
        });

        // Google Sign-In
        document.getElementById('googleBtn').addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                await verifyAdminAndRedirect(res.user);
            } catch (err) {
                showAlert(err.message);
            }
        });

        // Auto redirect if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await verifyAdminAndRedirect(user);
            }
        });
    </script>
</body>
</html>
