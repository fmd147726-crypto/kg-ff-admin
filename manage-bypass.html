<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Free Bypass</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07030b; --card-bg: #0f0a1d; --border-purple: #1f1a2e;
            --neon-purple: #a855f7; --neon-pink: #ff007f; --neon-green: #00ff7f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-back { background: #1a0b2b; color: white; text-decoration: none; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border-purple); font-weight: bold; font-size: 13px; }
        .btn-back:hover { border-color: var(--neon-purple); }
        .section-box { background: var(--card-bg); border: 1px solid var(--border-purple); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .section-title { font-size: 16px; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; color: var(--neon-purple); display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #aaa; margin-bottom: 6px; text-transform: uppercase; }
        .form-input { width: 100%; background: #07030b; border: 1px solid var(--border-purple); color: white; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 14px; }
        .form-input:focus { border-color: var(--neon-purple); }
        .btn-submit { background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink)); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .item-card { background: #07030b; border: 1px solid var(--border-purple); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background: rgba(255, 0, 127, 0.15); border: 1px solid var(--neon-pink); color: var(--neon-pink); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete:hover { background: var(--neon-pink); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> BACK</a>
            <h2 style="font-size: 18px; font-weight: 800;">MANAGE FREE BYPASS</h2>
        </div>

        <!-- Page Settings Form -->
        <div class="section-box">
            <div class="section-title"><i class="fas fa-cog"></i> Page Settings</div>
            <div class="form-group">
                <label>Video URL (YouTube or Google Drive)</label>
                <input type="text" id="videoUrl" class="form-input" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label>How To Skip Link</label>
                <input type="text" id="skipUrl" class="form-input" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>RAR Password</label>
                <input type="text" id="rarPassword" class="form-input" placeholder="1234">
            </div>
            <button class="btn-submit" onclick="saveSettings()">Save Settings</button>
        </div>

        <!-- Add Product Form -->
        <div class="section-box">
            <div class="section-title"><i class="fas fa-plus-circle"></i> Add New Bypass Item</div>
            <div class="form-group">
                <label>Title / Item Name</label>
                <input type="text" id="itemTitle" class="form-input" placeholder="e.g. Free Bypass OB55">
            </div>
            <div class="form-group">
                <label>Download Link</label>
                <input type="text" id="itemDownload" class="form-input" placeholder="https://...">
            </div>
            <button class="btn-submit" onclick="addItem()">Add Bypass Item</button>
        </div>

        <!-- Existing Items List -->
        <div class="section-box">
            <div class="section-title"><i class="fas fa-list"></i> Existing Items</div>
            <div class="grid" id="itemsList">
                <p style="color: #aaa; font-size: 13px;">Loading items...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Load existing settings
        onValue(ref(db, "settings/free_bypass"), snapshot => {
            const data = snapshot.val() || {};
            document.getElementById('videoUrl').value = data.video_url || '';
            document.getElementById('skipUrl').value = data.how_to_skip || '';
            document.getElementById('rarPassword').value = data.rar_password || '';
        });

        // Save settings to Firebase
        window.saveSettings = function() {
            const settings = {
                video_url: document.getElementById('videoUrl').value.trim(),
                how_to_skip: document.getElementById('skipUrl').value.trim(),
                rar_password: document.getElementById('rarPassword').value.trim()
            };
            set(ref(db, "settings/free_bypass"), settings)
                .then(() => alert("Settings saved successfully!"))
                .catch(err => alert("Error saving settings: " + err.message));
        };

        // Add new bypass item to Firebase
        window.addItem = function() {
            const title = document.getElementById('itemTitle').value.trim();
            const download = document.getElementById('itemDownload').value.trim();

            if (!title || !download) {
                alert("Please fill in both title and download link!");
                return;
            }

            const newItemRef = push(ref(db, "free_bypass"));
            set(newItemRef, {
                title: title,
                download: download,
                timestamp: Date.now()
            }).then(() => {
                alert("Item added successfully!");
                document.getElementById('itemTitle').value = '';
                document.getElementById('itemDownload').value = '';
            }).catch(err => alert("Error adding item: " + err.message));
        };

        // Render items live from Firebase
        onValue(ref(db, "free_bypass"), snapshot => {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';

            if (!snapshot.exists()) {
                list.innerHTML = '<p style="color: #aaa; font-size: 13px;">No items added yet.</p>';
                return;
            }

            snapshot.forEach(child => {
                const key = child.key;
                const item = child.val();
                list.innerHTML += `
                    <div class="item-card">
                        <div>
                            <div style="font-weight: bold; font-size: 14px;">${item.title || 'Bypass Item'}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteItem('${key}')"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        });

        // Delete item from Firebase
        window.deleteItem = function(key) {
            if (confirm("Are you sure you want to delete this item?")) {
                remove(ref(db, `free_bypass/${key}`));
            }
        };
    </script>
</body>
</html>
