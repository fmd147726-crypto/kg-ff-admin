<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGFF Panel Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0f; --card: #12131a; --border: #1a1c26;
      --red: #FF3366; --red-glow: rgba(255, 51, 102, 0.3); --text: #fff; --muted: #8c8ea0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; display: flex; min-height: 100vh; }

    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--card); border: 1px solid var(--red); padding: 30px; border-radius: 12px;
      width: 100%; max-width: 380px; box-shadow: 0 0 30px var(--red-glow); text-align: center;
    }
    .login-box h2 { font-family: 'Orbitron', sans-serif; color: var(--red); margin-bottom: 20px; }
    .input-field {
      width: 100%; padding: 12px; background: #181922; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; margin-bottom: 15px; font-family: inherit;
    }

    .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
    .sidebar h2 { font-family: 'Orbitron', sans-serif; color: var(--red); font-size: 1.2rem; margin-bottom: 30px; }
    .nav-item { color: var(--muted); text-decoration: none; padding: 12px; border-radius: 6px; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .nav-item.active, .nav-item:hover { background: #1a1c26; color: var(--red); }
    
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; }

    .card-panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 25px; }
    .card-panel h3 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--red); margin-bottom: 15px; }
    
    .btn { background: var(--red); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .btn-secondary { background: #1c1e2b; border: 1px solid var(--border); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1a1c26; }
  </style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div id="login-screen">
    <div class="login-box">
      <h2>KGFF ADMIN LOGIN</h2>
      <input type="text" id="admin-user" class="input-field" placeholder="Username">
      <input type="password" id="admin-pass" class="input-field" placeholder="Password">
      <button class="btn" style="width:100%;" onclick="doLogin()">LOGIN TO DASHBOARD</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>KGFF ADMIN</h2>
    <div class="nav-item active" onclick="switchPage('dashboard')">📊 Dashboard</div>
    <a href="https://fmd147726-crypto.github.io/kg-ff-panel/" target="_blank" class="nav-item">🌐 Visit User Site</a>
    <a href="https://imgbb.com/" target="_blank" class="nav-item">🖼️ ImgBB Host</a>
    <a href="https://postimages.org/" target="_blank" class="nav-item">🖼️ PostImages Host</a>
    <div class="nav-item" style="margin-top: auto; color: #ff4444;" onclick="doLogout()">🚪 Logout</div>
  </aside>

  <!-- MAIN DASHBOARD -->
  <main class="main-content">
    <div class="header">
      <h1 id="page-title">Overview Dashboard</h1>
      <button class="btn btn-secondary" onclick="doLogout()">Logout</button>
    </div>

    <!-- PAGE: DASHBOARD -->
    <div id="page-dashboard">
      <div class="grid-2">
        <div class="card-panel">
          <h3>GLOBAL DISCORD LINK</h3>
          <input type="text" id="global-discord-input" class="input-field" placeholder="https://discord.gg/...">
          <button class="btn" onclick="saveDiscordLink()">SAVE DISCORD LINK</button>
        </div>

        <div class="card-panel">
          <h3>GLOBAL TOP-UP LINK</h3>
          <input type="text" id="global-topup-input" class="input-field" placeholder="https://codashop.com/">
          <button class="btn" onclick="saveTopupLink()">SAVE TOPUP LINK</button>
        </div>
      </div>

      <div class="card-panel">
        <h3>HOMEPAGE CATEGORY VISIBILITY</h3>
        <div id="category-visibility-list"></div>
      </div>
    </div>
  </main>

  <script>
    const FIREBASE_URL = "https://kg-ff-panel-default-rtdb.firebaseio.com";

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      loadDashboardData();
    });

    function checkAuth() {
      if (localStorage.getItem('kgff_admin_token') !== 'authenticated') {
        document.getElementById('login-screen').style.display = 'flex';
      } else {
        document.getElementById('login-screen').style.display = 'none';
      }
    }

    function doLogin() {
      const u = document.getElementById('admin-user').value;
      const p = document.getElementById('admin-pass').value;
      if (u === 'admin' && p === 'admin123') {
        localStorage.setItem('kgff_admin_token', 'authenticated');
        document.getElementById('login-screen').style.display = 'none';
      } else {
        alert('Invalid Admin Credentials!');
      }
    }

    function doLogout() {
      localStorage.removeItem('kgff_admin_token');
      location.reload();
    }

    function loadDashboardData() {
      document.getElementById('global-discord-input').value = localStorage.getItem('kgff_discord_link') || "https://discord.gg/NZsbZq4C7";
      document.getElementById('global-topup-input').value = localStorage.getItem('kgff_topup_link') || "https://codashop.com/";
      renderCategories();
    }

    function saveDiscordLink() {
      const val = document.getElementById('global-discord-input').value;
      localStorage.setItem('kgff_discord_link', val);
      syncToFirebase({ discord: val });
      alert('Discord link saved & updated in Firebase!');
    }

    function saveTopupLink() {
      const val = document.getElementById('global-topup-input').value;
      localStorage.setItem('kgff_topup_link', val);
      syncToFirebase({ topup: val });
      alert('Top-Up link saved & updated in Firebase!');
    }

    function renderCategories() {
      const defaultMeta = [
        {id:'freefire-apk', title:'Free Fire APK', visible:true},
        {id:'emulator', title:'Emulator', visible:true},
        {id:'free-bypass', title:'Free Bypass', visible:true},
        {id:'free-panel', title:'Free Panel', visible:true},
        {id:'paid-mobile', title:'Paid Mobile Panels', visible:true},
        {id:'paid-pc', title:'Paid PC Panels', visible:true}
      ];
      const categories = JSON.parse(localStorage.getItem('kgff_category_meta')) || defaultMeta;
      const container = document.getElementById('category-visibility-list');
      container.innerHTML = '';

      categories.forEach((cat, idx) => {
        container.innerHTML += `
          <div class="switch-row">
            <span>${cat.title}</span>
            <button class="btn ${cat.visible ? '' : 'btn-secondary'}" onclick="toggleCategory(${idx})">
              ${cat.visible ? 'VISIBLE (ON)' : 'HIDDEN (OFF)'}
            </button>
          </div>
        `;
      });
      localStorage.setItem('kgff_category_meta', JSON.stringify(categories));
    }

    function toggleCategory(index) {
      const categories = JSON.parse(localStorage.getItem('kgff_category_meta'));
      categories[index].visible = !categories[index].visible;
      localStorage.setItem('kgff_category_meta', JSON.stringify(categories));
      syncToFirebase({ categories });
      renderCategories();
    }

    function syncToFirebase(payload) {
      fetch(`${FIREBASE_URL}/settings.json`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => console.log('Successfully updated Firebase!'))
      .catch(err => console.error('Firebase error:', err));
    }
  </script>
</body>
</html>
