<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KG FF Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #05020a;
            --card-bg: #0b0512;
            --border-color: #1a0b2e;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --orange-color: #ffaa00;
            --neon-green: #00cc66;
            --text-light: #ffffff;
            --text-gray: #777777;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }
        
        .admin-layout { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; height: 100vh; top: 0; left: 0; }
        .sidebar-brand { padding: 25px; border-bottom: 1px solid var(--border-color); }
        .sidebar-brand h2 { font-size: 18px; font-weight: 900; color: white; letter-spacing: 2px; }
        .sidebar-nav { padding: 20px 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .nav-category { font-size: 10px; text-transform: uppercase; color: var(--text-gray); letter-spacing: 2px; margin: 15px 0 5px 10px; font-weight: bold; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-gray); text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(157, 0, 255, 0.1); color: white; border: 1px solid rgba(157, 0, 255, 0.3); }
        .nav-item i { width: 18px; text-align: center; }

        /* Main Content */
        .main-content { margin-left: 260px; flex: 1; padding: 40px; }
        .top-header { margin-bottom: 30px; }
        .top-header h1 { font-size: 26px; font-weight: 900; text-transform: uppercase; color: white; margin-bottom: 5px; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .panel-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; display: flex; flex-direction: column; gap: 20px; position: relative; transition: 0.3s; }
        .panel-card:hover { border-color: var(--neon-purple); transform: translateY(-3px); box-shadow: 0 5px 20px rgba(157, 0, 255, 0.1); }
        .card-icon { font-size: 28px; width: 50px; height: 50px; background: rgba(157, 0, 255, 0.05); border: 1px solid rgba(157, 0, 255, 0.2); display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .panel-card h3 { font-size: 16px; font-weight: 800; color: white; text-transform: uppercase; }
        .card-actions { display: flex; gap: 10px; }
        .btn-manage { flex: 1; background: var(--neon-purple); color: white; padding: 10px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none; text-align: center; transition: 0.3s; }
        .btn-manage:hover { background: #8a00e6; box-shadow: 0 0 15px rgba(157, 0, 255, 0.4); }
        .btn-edit { background: transparent; border: 1px solid var(--border-color); color: var(--text-light); padding: 10px 15px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none; text-align: center; transition: 0.3s; }
        .btn-edit:hover { border-color: white; background: rgba(255,255,255,0.05); }

        @media(max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-brand h2, .nav-category, .nav-item span { display: none; }
            .main-content { margin-left: 70px; padding: 20px; }
        }
    </style>
</head>
